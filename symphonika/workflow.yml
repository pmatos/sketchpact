workflow:
  name: sketchpact_plan_tdd_pr
  initial: plan

  states:
    plan:
      action:
        kind: agent
        provider: claude
        prompt: prompts/plan.md
      transitions:
        # BLOCKED.md is checked first: exiting non-zero from a Bash call does not
        # end the provider session, so provider_success is true even when blocked.
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        # branch_advanced_since_attempt_start stops a resumed attempt from coasting
        # on a PLAN.md an earlier attempt left behind.
        - to: implement
          when:
            provider_success: true
            artifact_exists: PLAN.md
            branch_advanced_since_attempt_start: true
        - to: failed

    implement:
      action:
        kind: agent
        provider: claude
        prompt: prompts/impl.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr_open
          when:
            provider_success: true
            branch_ahead_of_base: true
            branch_advanced_since_attempt_start: true
        - to: failed

    # pr_* predicates are only projected for kind: wait states, so PR existence
    # cannot be gated on implement's own transitions.
    wait_for_pr_open:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: code_review_fix
          when:
            pr_open: true
        - to: failed
          when:
            pr_open: false

    code_review_fix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/code-review-fix.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: simplify
          when:
            provider_success: true
        - to: failed

    simplify:
      action:
        kind: agent
        provider: claude
        prompt: prompts/simplify.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    wait_for_pr:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: merge
          when:
            checks: success
            mergeable: true
            unresolved_review_threads: 0
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure
        # Green checks with an open review thread would otherwise park forever:
        # merge needs zero threads and autofix needs failing checks.
        - to: autofix
          when:
            has_unresolved_reviews: true

    autofix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/autofix-pr.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    resolve_conflicts:
      action:
        kind: agent
        provider: claude
        prompt: prompts/resolve-conflicts.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    merge:
      action:
        kind: merge_pr
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure

    merged:
      terminal: success

    failed:
      terminal: blocked
