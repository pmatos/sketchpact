workflow:
  name: sketchpact_plan_tdd_pr
  initial: plan

  states:
    # Planning pass. Runs the pm-plan skill against the issue and commits the
    # result as PLAN.md, which the implement stage executes. Every agent state
    # is gated on the agent's own final-message claim: a blocked claim routes to
    # failed, and a missing or malformed claim falls through to failed.
    # branch_advanced_since_attempt_start is false unless this run added a
    # commit, so a resumed attempt cannot coast on a PLAN.md an earlier attempt
    # left behind.
    plan:
      action:
        kind: agent
        provider: claude
        prompt: prompts/plan.md
      transitions:
        - to: failed
          when:
            claim_status: blocked
        - to: implement
          when:
            claim_status: success
            provider_success: true
            artifact_exists: PLAN.md
            branch_advanced_since_attempt_start: true
        - to: failed

    implement:
      action:
        kind: agent
        provider: claude
        prompt: prompts/impl.md
      transitions:
        - to: failed
          when:
            claim_status: blocked
        # branch_ahead_of_base alone would be satisfied by the plan commit
        # already on the branch, so require this run to advance HEAD too.
        - to: wait_for_pr_open
          when:
            claim_status: success
            provider_success: true
            branch_ahead_of_base: true
            branch_advanced_since_attempt_start: true
        - to: failed

    # implement's own transition only proves local git state -- a commit ahead
    # of base -- not that the push + `gh pr create` actually happened. Parking
    # here before code_review_fix reuses the tracked-PR-by-issue and
    # PR-discovery machinery wait_for_pr relies on below, so a turn that ended
    # before opening a PR parks and eventually terminalizes blocked instead of
    # walking into code_review_fix/simplify against a PR that was never opened.
    wait_for_pr_open:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: code_review_fix
          when:
            pr_open: true

    # Automated review pass on the freshly opened PR. Runs once per PR open
    # (repairs below loop back to wait_for_pr only, not through here), so a
    # CI-failure -> autofix -> recheck cycle doesn't re-run code review every
    # tick.
    code_review_fix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/code-review-fix.md
      transitions:
        # Exiting non-zero from a Bash tool call only ends that subshell, not
        # the provider session, so provider_success reads true regardless. A
        # blocked pass claims "blocked" instead, and advance needs a positive
        # success claim.
        - to: failed
          when:
            claim_status: blocked
        - to: simplify
          when:
            claim_status: success
            provider_success: true
        - to: failed

    simplify:
      action:
        kind: agent
        provider: claude
        prompt: prompts/simplify.md
      transitions:
        - to: failed
          when:
            claim_status: blocked
        - to: wait_for_pr
          when:
            claim_status: success
            provider_success: true
        - to: failed

    # Poll-driven park state, re-evaluated each daemon tick against the PR
    # signals. Transitions are checked top-down; first match wins.
    #
    # The FSM owns every outcome here, unresolved reviews included: failing
    # checks -> autofix, merge conflicts -> resolve, reviewer feedback ->
    # autofix, clean -> merge. A case this state does not name is a case
    # nothing handles -- the run parks and raises manual attention.
    wait_for_pr:
      action:
        kind: wait
      transitions:
        # External-merge catch-all for manual merges and any other path that
        # lands the PR outside the FSM. pr_merged is only ever true post-merge,
        # so this never short-circuits the normal wait -> merge -> merged path.
        - to: merged
          when:
            pr_merged: true
        # Closed-unmerged escape. mergeable is absent for closed PRs and
        # pr_merged is emitted only when merged, so a PR closed without being
        # merged would otherwise either park forever (last checks green) or
        # mis-route into autofix on a dead branch (last checks failing). Must
        # come AFTER pr_merged: true so merged PRs still take the merged path.
        - to: failed
          when:
            pr_open: false
        - to: merge
          when:
            checks: success
            mergeable: true
            unresolved_review_threads: 0
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure
        # Reviewer feedback on an otherwise-green PR. Ordered last so a clean
        # PR still merges and a broken one still repairs first. Without this
        # the state parks forever on green checks plus one unresolved thread,
        # because `merge` needs unresolved_review_threads: 0 and `autofix`
        # needs failing checks. The progress guard stops the
        # autofix -> wait_for_pr -> autofix cycle this opens once the
        # observation stops changing.
        - to: autofix
          when:
            has_unresolved_reviews: true

    autofix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/autofix-pr.md
      transitions:
        - to: failed
          when:
            claim_status: blocked
        - to: wait_for_pr
          when:
            claim_status: success
            provider_success: true
        - to: failed

    resolve_conflicts:
      action:
        kind: agent
        provider: claude
        prompt: prompts/resolve-conflicts.md
      transitions:
        - to: failed
          when:
            claim_status: blocked
        - to: wait_for_pr
          when:
            claim_status: success
            provider_success: true
        - to: failed

    # FSM-controlled merge. Respects the symphonika.yml pull_requests.merge
    # policy.
    #
    # Escape transitions cover the window between the wait_for_pr gate check
    # and the next merge tick: a late check flip or a late conflict routes back
    # to the right repair state instead of parking forever. No generic
    # catch-all back to wait_for_pr -- that would loop on transient merge
    # failures (API hiccup, branch protection deadlock) because wait_for_pr's
    # clean predicates would immediately re-advance.
    merge:
      action:
        kind: merge_pr
      transitions:
        - to: merged
          when:
            pr_merged: true
        # Closed-unmerged escape (mirrors wait_for_pr). Must come AFTER
        # pr_merged: true so merged PRs still terminate as merged.
        - to: failed
          when:
            pr_open: false
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure

    merged:
      terminal: success

    failed:
      terminal: blocked
